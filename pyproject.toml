[project]
name = "causiq"
version = "0.1.0"
description = "Causiq - Autonomous AI Reliability Engineer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Dependency policy (Engineering Contract 5.1, ADR-0002): every dependency must
# name the requirement it serves. Nothing is added before the phase that uses it.
dependencies = [
    "anthropic>=1.6.0",       # the AnthropicModelClient adapter, isolated there (ADR-0001)
    "duckdb>=1.5.5",          # the evidence substrate + query_warehouse (ADR-0003, ADR-0007)
    "pydantic>=2.9",          # domain validation + JSON Schema generation (ADR-0005)
    "pydantic-settings>=2.5", # environment-driven config, validated at startup
    "structlog>=24.4",        # structured JSON logging with correlation ids
]

# Deliberately NOT yet declared - each arrives with the phase that needs it:
#   typer      -> P0.7 (CLI delivery surface)
#   opentelemetry-sdk, langfuse -> P3 (ADR-0004 fixes the seam now, not the exporter)

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causiq"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
# The primary working copy lives inside a OneDrive-synced folder, where uv's
# default hardlink install fails with "os error 396" (incompatible hardlinks).
# Copy mode is slightly slower and always correct.
[tool.uv]
link-mode = "copy"

# ---------------------------------------------------------------------------
# Ruff - lint + format in one tool (Engineering Contract 5.1)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # timezone-aware datetimes - load-bearing for audit records
    "T20",      # no print() in library code
    "RET",      # return simplification
    "SIM",      # simplify
    "PTH",      # pathlib over os.path
    "RUF",      # ruff-specific
]
ignore = [
    "RUF012",  # mutable class attrs need ClassVar - noisy against pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# Mypy - strict on src (Engineering Contract 11)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# Pytest - the default run is offline and deterministic (Contract 10, I6)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -p no:cacheprovider: the OneDrive-synced working copy denies the rename
# pytest uses to create .pytest_cache. The cache is a convenience, not a gate.
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
markers = [
    "unit: pure logic, no I/O",
    "contract: schema and invariant stability",
    "integration: real local resources, no network",
    "live: requires ANTHROPIC_API_KEY and network - skipped by default",
]

[tool.coverage.run]
source = ["src/causiq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
