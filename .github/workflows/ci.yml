# Causiq CI - the gate defined by Engineering Contract 10 and AC-15.
#
# Two properties this workflow protects:
#   * The suite runs with NO ANTHROPIC_API_KEY and no network dependency (I6).
#     No secret is referenced anywhere in this file, so a test that quietly
#     started needing one would fail here even if it passed on a developer
#     machine.
#   * Both coverage gates hold: >= 85% overall, 100% on the invariant-critical
#     modules (domain, evidence, authz).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The contract's floor and the version developed against.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy

      - name: Tests and coverage gate (>= 85% overall)
        run: uv run pytest -m "not live" --cov --cov-report=term-missing --cov-fail-under=85

      - name: Coverage gate (100% on invariant-critical modules)
        run: |
          uv run pytest -m "not live" -q \
            --cov=src/causiq/domain \
            --cov=src/causiq/evidence \
            --cov=src/causiq/authz \
            --cov=src/causiq/tools \
            --cov-report=term-missing \
            --cov-fail-under=100
